# Tests unitaires : un dossier tests/ par couche. Lancer depuis la racine :  .venv\Scripts\python -m pytest
# conftest.py (racine) prépare les secrets de test, la clé du faux registre et le médiateur en mémoire.
# tests/ (racine) : ce qui concerne toutes les couches (contrats openapi.yaml).
# tests/e2e/ : tests de bout en bout contre la pile qui tourne, lancés à la main (pas par pytest).
[pytest]
testpaths =
    registres/tests
    consentement-minimisation/tests
    passerelle/tests
    journal/tests
    espace-usager/tests
    resilience/tests
    socle/tests
    tests
# Quelques tests réutilisent les outils d'un autre fichier de test (faux registre, faux téléphone…)
pythonpath =
    registres/tests
    passerelle/tests
    espace-usager/tests
