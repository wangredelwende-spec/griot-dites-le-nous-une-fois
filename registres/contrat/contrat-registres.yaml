# Contrat des registres de Griot Secure (pas de contrat commun imposé : chaque équipe définit ses registres).
#
# Contrat OpenAPI commun à nos 3 registres simulés (état civil, nationalité, casier). Une route par registre : lire la fiche d'un citoyen par son identifiant ; 404 si le
# citoyen est inconnu. Les noms de champs ci-dessous ne sont écrits qu'ici et dans
# consentement-minimisation/catalogue/correspondance.yaml.
#
# Brancher le registre d'une autre équipe : annuaire.yaml + correspondance.yaml seulement (docs/brancher-un-registre.md). Les réponses des registres sont validées contre ce fichier :
# une réponse non conforme est rejetée et écrite au journal.
openapi: 3.1.0
info:
  title: Contrat des registres (Griot Secure)
  version: 1.0.0
paths:
  /etat-civil/{id}:
    get:
      summary: Fiche d'état civil d'un citoyen
      operationId: lireEtatCivil
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: La fiche
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EtatCivil"}
        "404":
          description: Citoyen inconnu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Erreur"}
  /nationalite/{id}:
    get:
      summary: Nationalité d'un citoyen
      operationId: lireNationalite
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: La fiche
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Nationalite"}
        "404":
          description: Citoyen inconnu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Erreur"}
  /casier/{id}:
    get:
      summary: Casier judiciaire d'un citoyen (nombre de condamnations)
      operationId: lireCasier
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: La fiche
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Casier"}
        "404":
          description: Citoyen inconnu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Erreur"}
components:
  schemas:
    EtatCivil:
      type: object
      additionalProperties: false
      required: [id, nom, prenoms, date_naissance, lieu_naissance, pere, mere, date_deces]
      properties:
        id: {type: string, minLength: 1}
        nom: {type: string, minLength: 1}
        prenoms: {type: string, minLength: 1}
        date_naissance: {type: string, minLength: 1}      # AAAA-MM-JJ ; une date incomplète est refusée par la passerelle
        lieu_naissance: {type: string, minLength: 1}
        pere: {type: string}
        mere: {type: string}
        date_deces: {type: [string, "null"]}               # vide ou null : vivant
    Nationalite:
      type: object
      additionalProperties: false
      required: [id, nationalite]
      properties:
        id: {type: string, minLength: 1}
        nationalite: {type: string, minLength: 1}
    Casier:
      type: object
      additionalProperties: false
      required: [id, nombre_condamnations]
      properties:
        id: {type: string, minLength: 1}
        nombre_condamnations: {type: integer, minimum: 0}
    Erreur:
      type: object
      required: [detail]
      properties:
        detail: {type: string}
