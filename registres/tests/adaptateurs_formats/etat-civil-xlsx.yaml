# Jeu d'essai : état civil au format xlsx (registres/tests/donnees_formats). Aucune ligne de code changée : seulement ce fichier.
registre: etat-civil
emetteur: registre-etat-civil
source:
  type: xlsx                        # Excel : première ligne = noms des colonnes
  chemin: /donnees/etat_civil.xlsx
  feuille: Etat civil
identite: "N° d'identification"
champs:
  date_naissance: "Date de naissance"
  date_deces: "Date de décès"
format_date: "%d/%m/%Y"             # 14/03/2001 ; « 2004 » (année seule) reste accepté ; « vers 1990 » : refus
refuser_si_decede: true
motif_refus_public: "réponse impossible, s'adresser à l'état civil"
groupes: {Mairie: mairie}
attributs:
  majeur:
    regle: age_entre
    champ: date_naissance
    claim: age_equal_or_over
    services:
      mairie:
        - {min: 18, date_reference: aujourd'hui}
