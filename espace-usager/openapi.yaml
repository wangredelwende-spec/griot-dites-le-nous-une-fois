          title: N
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /portail/accords:
    get:
      summary: Accords
      operationId: accords_portail_accords_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /portail/accords/{id_demande}/retirer:
    post:
      summary: Retirer
      description: 'Deux temps, comme l''USSD : la question (« Retirer votre accord à … ? »), puis le retrait.'
      operationId: retirer_portail_accords__id_demande__retirer_post
      parameters:
      - name: id_demande
        in: path
        required: true
        schema:
          type: string
          title: Id Demande
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_retirer_portail_accords__id_demande__retirer_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Body_allumer_allumer_post:
      properties:
