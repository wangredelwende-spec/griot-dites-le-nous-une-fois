# Adaptateur du casier judiciaire (données fictives). Voir docs/BRANCHER_UN_REGISTRE.md.
# Le détail des condamnations ne sort JAMAIS du registre : seulement « vierge : oui/non ».
registre: casier
emetteur: registre-casier

source:
  type: csv
  chemin: /donnees/casier.csv
  separateur: ";"

identite: nip
champs:
  nombre_condamnations: nombre_condamnations
  peines_complementaires: peines_complementaires
refuser_si_decede: false
# Personne absente du casier :
#   refus  (par défaut) : « réponse impossible » : absent n'est pas vierge, on ne devine pas ;
#   vierge : comme le vrai casier, qui ne contient que les condamnations. Le médiateur vérifie alors
#            D'ABORD à l'état civil que la personne existe (sinon : « identité non confirmée »).
# À trancher avec les données du jury.
absence: refus
motif_refus_public: "réponse impossible, s'adresser au greffe"

# Groupes Keycloak que CE registre reconnaît (nom du groupe dans le jeton de l'agent -> code du service).
# Le registre vérifie lui-même le jeton de l'agent : le service n'est plus une simple déclaration du médiateur.
groupes:
  Direction des concours – ministère des Serviteurs du peuple: direction-concours
  Service des bourses: service-bourses
  Mairie: mairie
  Division de la Migration – Police nationale: service-passeport

attributs:
  casier_judiciaire_vierge:
    regle: nombre_nul               # « 0 » -> true ; « 2 » -> false ; vide ou illisible -> refus
    champ: nombre_condamnations
    claim: casier_judiciaire_vierge # réponse : {"casier_judiciaire_vierge": true}
    services: [direction-concours]                    # double clé : seul ce service interroge le casier
  # Passeport : la Police n'a pas besoin de savoir si le casier est vierge, seulement s'il existe une
  # INTERDICTION DE SORTIE DU TERRITOIRE (peine complémentaire). Plus minimal que « casier vierge » :
  # une condamnation pour vol, sans interdiction, ne regarde pas le service des passeports.
  interdiction_sortie_territoire:
    regle: contient                 # champ vide -> refus ; contient la mention -> true ; sinon (« aucune »…) -> false
    champ: peines_complementaires
    mention: interdiction de sortie du territoire
    claim: interdiction_sortie_territoire   # réponse : {"interdiction_sortie_territoire": false}
    services: [service-passeport]
