# Adaptateur du registre d'état civil (données fictives).
# Il décrit comment lire ce registre SANS changer le code : voir docs/BRANCHER_UN_REGISTRE.md.
registre: etat-civil
emetteur: registre-etat-civil       # « iss » des réponses signées

source:
  type: csv                         # csv | json
  chemin: /donnees/etat_civil.csv
  separateur: ";"

# Colonne qui identifie un citoyen dans ce registre (comparée au sujet_ref de la demande).
# Aucune fiche : « introuvable » ; plusieurs fiches : « identité ambiguë ».
identite: nip

# Nom utilisé par le code -> nom de la colonne dans le fichier
champs:
  date_naissance: date_naissance
  date_deces: date_deces
  nom: nom
  prenoms: prenoms
  lieu_naissance: lieu_naissance
  pere: pere
  mere: mere

# Une fiche dont « date_deces » est remplie est refusée
refuser_si_decede: true

# Motif envoyé (signé) pour TOUT refus : introuvable, ambigu, date insuffisante, décès…
# Le motif précis reste dans le registre ; le guichet n'apprend rien de plus.
motif_refus_public: "réponse impossible, s'adresser à l'état civil"

# Groupes Keycloak que CE registre reconnaît (nom du groupe dans le jeton de l'agent -> code du service).
# Le registre vérifie lui-même le jeton de l'agent : le service n'est plus une simple déclaration du médiateur.
groupes:
  Direction des concours – ministère des Serviteurs du peuple: direction-concours
  CEFORE – guichet des entreprises: cefore
  Tribunal – certificats de nationalité: tribunal

# Attributs calculables. Seul le résultat est renvoyé, jamais la fiche.
# « services » = DOUBLE CLÉ : le registre refuse lui-même tout service absent de cette liste,
# même si le médiateur a laissé passer la demande. Pour un attribut à paramètres, la double clé porte aussi
# sur les PARAMÈTRES : seuls les seuils et dates listés ici sont acceptés. Sinon, un service pourrait
# reconstituer une date de naissance en posant des questions avec des seuils différents.
# Base juridique que CE registre accepte, PAR SERVICE (double clé sur le mode de consultation) :
#   consentement: true  -> l'usager voit l'aperçu et confirme avant l'envoi ;
#   base_legale: [...]  -> sans accord de l'usager, SEULEMENT si le texte cité par la démarche contient
#                          l'une de ces références. Service ou mode absent d'ici : refus (au chargement du
#                          catalogue par le médiateur, ET par le registre lui-même, réponse signée).
bases:
  direction-concours:
    base_legale: ["loi n°081-2015/CNT", "loi n°012-2025/ALT"]   # concours (statut général) ; majorité civile
  cefore:
    consentement: true                                           # entreprise individuelle : l'usager confirme
  tribunal:
    consentement: true                                           # certificat de nationalité : l'usager confirme

attributs:
  majeur:
    regle: age_entre                # paramètres de la demande : min, max (facultatif), date_reference
    champ: date_naissance
    claim: age_equal_or_over        # réponse : {"age_equal_or_over": {"18": true}, "date_reference": "2026-11-17"}
    services:
      direction-concours:
        - {min: 18, date_reference: aujourd'hui}             # majorité civile (loi n°012-2025/ALT)
  identite:
    regle: champs                   # renvoie les cases listées (et RIEN d'autre) ; case vide -> refus
    champs: [nom, prenoms]
    claim: identite                 # réponse : {"identite": {"nom": "KABORE", "prenoms": "Aminata"}}
    services: [cefore]
  naissance_filiation:
    regle: champs
    champs: [date_naissance, lieu_naissance, pere, mere]    # date complète exigée (« né vers 1990 » : refus)
    claim: naissance_filiation
    services: [tribunal]
  personne_connue:
    regle: existe                   # une seule fiche et personne vivante -> true ; sinon refus
    claim: personne_connue          # sert à la passerelle avant un casier « absence: vierge »
    services: [direction-concours, cefore]
