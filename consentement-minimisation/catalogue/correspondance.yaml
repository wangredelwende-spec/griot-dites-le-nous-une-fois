# CORRESPONDANCE DES CHAMPS : l'UNIQUE endroit où figurent les noms de champs des registres du contrat.
#
# PROVISOIRE : rempli d'après registres/contrat/contrat-provisoire.yaml. À refaire quand le contrat du jury arrive.
# À gauche : le nom que la passerelle utilise (ne pas changer) ; à droite : le nom du champ dans la réponse du
# registre (le contrat). Une valeur vide (null) = « correspondance non renseignée » : la minimisation REFUSE,
# on ne devine jamais un nom de champ.
registres:
  etat-civil:
    nom: nom
    prenoms: prenoms
    date_naissance: date_naissance
    lieu_naissance: lieu_naissance
    pere: pere
    mere: mere
    date_deces: date_deces
  nationalite:
    nationalite: nationalite
  casier:
    nombre_condamnations: nombre_condamnations
