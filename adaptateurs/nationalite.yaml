# Adaptateur du registre de la nationalité (données fictives). Voir docs/BRANCHER_UN_REGISTRE.md.
registre: nationalite
emetteur: registre-nationalite

source:
  type: csv
  chemin: /donnees/nationalite.csv
  separateur: ";"

identite: nip
champs:
  nationalite: nationalite
refuser_si_decede: false            # ce registre ne connaît pas les décès (c'est l'état civil)
motif_refus_public: "réponse impossible, s'adresser au service de la nationalité"

# Groupes Keycloak que CE registre reconnaît (nom du groupe dans le jeton de l'agent -> code du service).
# Le registre vérifie lui-même le jeton de l'agent : le service n'est plus une simple déclaration du médiateur.
groupes:
  Direction des concours – ministère des Serviteurs du peuple: direction-concours
  Service des bourses: service-bourses
  Mairie: mairie
  Division de la Migration – Police nationale: service-passeport

attributs:
  nationalite_burkinabe:
    regle: egal                     # champ renseigné et égal à la valeur -> true ; autre valeur -> false ; vide -> refus
    champ: nationalite
    valeur: burkinabe
    claim: nationalite_burkinabe    # réponse : {"nationalite_burkinabe": true}
    services: [direction-concours, service-bourses, service-passeport]   # double clé : la mairie n'y a pas droit
