# Contrat d'API de la couche « Registres ». GÉNÉRÉ par scripts/generer_openapi.py à partir de
# registres/contrat/contrat-provisoire.yaml (PROVISOIRE) : ne pas modifier à la main.
openapi: 3.1.0
info:
  title: 'Griot : Registres (état civil, nationalité, casier)'
  version: '1.0'
  description: 'Chaque registre expose la fiche d''un citoyen par son identifiant (404 si inconnu), selon le contrat commun
    (PROVISOIRE : registres/contrat/contrat-provisoire.yaml, à remplacer par celui du jury). Appelé par la passerelle d''échange
    seulement (réseau « registres »), jamais publié.'
paths:
  /etat-civil/{id}:
    get:
      summary: Fiche d'état civil d'un citoyen
      operationId: lireEtatCivil
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: La fiche
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtatCivil'
        '404':
          description: Citoyen inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /nationalite/{id}:
    get:
      summary: Nationalité d'un citoyen
      operationId: lireNationalite
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: La fiche
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nationalite'
        '404':
          description: Citoyen inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /casier/{id}:
    get:
      summary: Casier judiciaire d'un citoyen (nombre de condamnations)
      operationId: lireCasier
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: La fiche
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Casier'
        '404':
          description: Citoyen inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
components:
  schemas:
    EtatCivil:
      type: object
      additionalProperties: false
      required:
      - id
      - nom
      - prenoms
      - date_naissance
      - lieu_naissance
      - pere
      - mere
      - date_deces
      properties:
        id:
          type: string
          minLength: 1
        nom:
          type: string
          minLength: 1
        prenoms:
          type: string
          minLength: 1
        date_naissance:
          type: string
          minLength: 1
        lieu_naissance:
          type: string
          minLength: 1
        pere:
          type: string
        mere:
          type: string
        date_deces:
          type:
          - string
          - 'null'
    Nationalite:
      type: object
      additionalProperties: false
      required:
      - id
      - nationalite
      properties:
        id:
          type: string
          minLength: 1
        nationalite:
          type: string
          minLength: 1
    Casier:
      type: object
      additionalProperties: false
      required:
      - id
      - nombre_condamnations
      properties:
        id:
          type: string
          minLength: 1
        nombre_condamnations:
          type: integer
          minimum: 0
    Erreur:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
