# Griot Secure, « Dites-le-nous une fois » : tous les services.
# Démarrage :  cp .env.example .env   puis   docker compose up -d --wait
# Les versions des images sont épinglées (jamais « latest ») pour un résultat reproductible.
name: griot

services:

  # Base de données de Keycloak uniquement (le médiateur utilise SQLite)
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}   # lu par init-bases.sh
    volumes:
      - postgres_donnees:/var/lib/postgresql/data
      - ./socle/postgres/init-bases.sh:/docker-entrypoint-initdb.d/init-bases.sh:ro
    networks: [interne]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Keycloak : comptes des agents (mot de passe + TOTP), services demandeurs (groupes)
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    # --import-realm : crée le realm « griot » au premier démarrage (ignoré ensuite)
    command: ["start", "--import-realm"]
    # Mémoire plafonnée (ordinateur de démo à 16 Go) : la JVM de Keycloak règle son tas
    # à 70 % de cette limite. 1 Go suffit pour quelques dizaines de comptes.
    mem_limit: 1g
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Adresse publique (vue par le navigateur) : c'est aussi l'émetteur (« iss ») des jetons
      KC_HOSTNAME: https://auth.griot.test
      # Les appels des services arrivent par http://keycloak:8080 (réseau interne)
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"           # HTTP en interne ; le HTTPS est assuré par Caddy
      KC_PROXY_HEADERS: xforwarded      # faire confiance aux en-têtes X-Forwarded-* de Caddy
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # La page de configuration du TOTP ne suggère que des applications open source
      # (FreeOTP, Aegis) : on retire Google Authenticator et Microsoft Authenticator.
      KC_SPI_OTP_APPLICATION__GOOGLE__ENABLED: "false"
      KC_SPI_OTP_APPLICATION__MICROSOFT_AUTHENTICATOR__ENABLED: "false"
      # Valeur injectée dans le fichier du realm (${...})
      GUICHET_OIDC_SECRET: ${GUICHET_OIDC_SECRET}
    volumes:
      - ./socle/keycloak/realm-griot.json:/opt/keycloak/data/import/realm-griot.json:ro
      - ./socle/keycloak/themes/griot:/opt/keycloak/themes/griot:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interne, cles-agents]
    healthcheck:
      # L'image n'a pas curl : on interroge /health/ready (port de gestion 9000) avec bash.
      # Réponse « 200 » = prêt ; « 503 » = encore en démarrage.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Registre simulé de l'état civil : calcule l'attribut minimal et le SIGNE avec sa propre clé.
  # Uniquement sur le réseau « registres » : seul le médiateur peut l'appeler.
  registre-etat-civil:
    build: ./registres
    image: griot-registre:local
    restart: unless-stopped
    environment:
      ADAPTATEUR: /adaptateurs/etat-civil.yaml
      OUTILS_TEST: ${OUTILS_TEST:-0}       # comptes de test refusés sauf si 1
    volumes:
      # SON adaptateur seulement, en lecture seule (le médiateur ne peut ni le lire en écriture ni le modifier)
      - ./registres/adaptateurs/etat-civil.yaml:/adaptateurs/etat-civil.yaml:ro
      # Données : fictives par défaut ; le jour J, DONNEES_REGISTRES=./donnees_jury dans .env (aucun code changé)
      - ${DONNEES_REGISTRES:-./registres/donnees_fictives}:/donnees:ro
      - cle_privee_etat_civil:/cles        # clé PRIVÉE : aucun autre service ne monte ce volume
      - cle_publique_etat_civil:/publique  # sa clé publique : seul ce registre peut l'écrire
      - trace_etat_civil:/trace                 # double trace : ses réponses signées (jamais la valeur)
    # « cles-agents » : pour lire les clés PUBLIQUES de Keycloak et vérifier lui-même le jeton de l'agent
    secrets: [api_jury]                  # jeton de l'API du jury (« {secret:api_jury} » dans l'adaptateur)
    # « relais-jury » : sans sortie ; ne sert que si le profil api-jury est lancé (API du jury en direct)
    networks: [registres, cles-agents, relais-jury]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/sante')"]
      interval: 10s
      timeout: 5s
      retries: 10

  registre-nationalite:
    build: ./registres
    image: griot-registre:local
    restart: unless-stopped
    environment:
      ADAPTATEUR: /adaptateurs/nationalite.yaml
      OUTILS_TEST: ${OUTILS_TEST:-0}       # comptes de test refusés sauf si 1
    volumes:
      # SON adaptateur seulement, en lecture seule (le médiateur ne peut ni le lire en écriture ni le modifier)
      - ./registres/adaptateurs/nationalite.yaml:/adaptateurs/nationalite.yaml:ro
      # Données : fictives par défaut ; le jour J, DONNEES_REGISTRES=./donnees_jury dans .env (aucun code changé)
      - ${DONNEES_REGISTRES:-./registres/donnees_fictives}:/donnees:ro
      - cle_privee_nationalite:/cles        # clé PRIVÉE : aucun autre service ne monte ce volume
      - cle_publique_nationalite:/publique  # sa clé publique : seul ce registre peut l'écrire
      - trace_nationalite:/trace                 # double trace : ses réponses signées (jamais la valeur)
    # « cles-agents » : pour lire les clés PUBLIQUES de Keycloak et vérifier lui-même le jeton de l'agent
    secrets: [api_jury]                  # jeton de l'API du jury (« {secret:api_jury} » dans l'adaptateur)
    # « relais-jury » : sans sortie ; ne sert que si le profil api-jury est lancé (API du jury en direct)
    networks: [registres, cles-agents, relais-jury]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/sante')"]
      interval: 10s
      timeout: 5s
      retries: 10

  registre-casier:
    build: ./registres
    image: griot-registre:local
    restart: unless-stopped
    environment:
      ADAPTATEUR: /adaptateurs/casier.yaml
      OUTILS_TEST: ${OUTILS_TEST:-0}       # comptes de test refusés sauf si 1
    volumes:
      # SON adaptateur seulement, en lecture seule (le médiateur ne peut ni le lire en écriture ni le modifier)
      - ./registres/adaptateurs/casier.yaml:/adaptateurs/casier.yaml:ro
      # Données : fictives par défaut ; le jour J, DONNEES_REGISTRES=./donnees_jury dans .env (aucun code changé)
      - ${DONNEES_REGISTRES:-./registres/donnees_fictives}:/donnees:ro
      - cle_privee_casier:/cles        # clé PRIVÉE : aucun autre service ne monte ce volume
      - cle_publique_casier:/publique  # sa clé publique : seul ce registre peut l'écrire
      - trace_casier:/trace                 # double trace : ses réponses signées (jamais la valeur)
    # « cles-agents » : pour lire les clés PUBLIQUES de Keycloak et vérifier lui-même le jeton de l'agent
    secrets: [api_jury]                  # jeton de l'API du jury (« {secret:api_jury} » dans l'adaptateur)
    # « relais-jury » : sans sortie ; ne sert que si le profil api-jury est lancé (API du jury en direct)
    networks: [registres, cles-agents, relais-jury]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/sante')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Médiateur : règles, appel des registres, vérification, consentement, journal chaîné.
  # API JSON jamais publiée par Caddy.
  mediateur:
    build:
      context: .                         # racine : la passerelle embarque aussi consentement/ et tracabilite/
      dockerfile: passerelle/Dockerfile
    image: griot-mediateur:local
    restart: unless-stopped
    environment:
      DELAI_REGISTRE: "3"                  # secondes avant de déclarer un registre indisponible
      OUTILS_TEST: ${OUTILS_TEST:-0}       # comptes de test (outil-test-*) refusés sauf si 1
      DUREE_CONSENTEMENT: "600"            # 10 minutes pour confirmer
      LIMITE_PAR_CITOYEN: "5"              # demandes d'un même service sur une même personne, par 24 h
      LIMITE_SUJETS: "5"                   # citoyens différents par agent et par heure (bas pour la démo)
      FENETRE_LIMITE: "3600"
      LIMITE_EXEMPTES: "agent.banc,agent.banc.bourses"   # exemptés SEULEMENT si OUTILS_TEST=1 (LIMITES.md)
    # Un secret par écran usager (USSD, portail web) : le canal écrit au journal vient du secret présenté
    secrets: [sujet_hmac, canal_usager, canal_web]
    volumes:
      - ./consentement-minimisation/catalogue:/catalogue:ro          # annuaire + catalogue des démarches
      - ./journal:/journal:ro              # verifier.py
      - ./registres/adaptateurs:/adaptateurs:ro      # descriptions publiées par les registres (« absence » du casier)
      - mediateur_donnees:/donnees         # journal chaîné + demandes en attente (SQLite)
      # Clé publique de chaque registre, en LECTURE SEULE (un volume par registre)
      - cle_publique_etat_civil:/publiques/etat-civil:ro
      - cle_publique_nationalite:/publiques/nationalite:ro
      - cle_publique_casier:/publiques/casier:ro
    depends_on:
      # Les registres montent leur volume en premier (ils en deviennent propriétaires et y écrivent leur clé).
      # « started » et non « healthy » : le médiateur doit tourner même si un registre est en panne.
      registre-etat-civil: {condition: service_started}
      registre-nationalite: {condition: service_started}
      registre-casier: {condition: service_started}
    networks: [interne, registres]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/sante')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Guichet des agents (guichet.griot.test). Pas sur le réseau « registres » : il ne peut pas
  # contourner le médiateur.
  guichet:
    build: ./guichet
    image: griot-guichet:local
    restart: unless-stopped
    environment:
      # Échange du code OIDC en http://keycloak:8080 : réseau Docker interne, jamais exposé
      AUTHLIB_INSECURE_TRANSPORT: "1"
    secrets: [guichet_oidc]
    volumes:
      - ./consentement-minimisation/catalogue:/catalogue:ro          # annuaire + catalogue des démarches
      - ./registres/adaptateurs:/adaptateurs:ro      # attributs déclarés par les registres
      # Même clé publique que le médiateur, lue directement dans le volume du registre (lecture seule) :
      # le médiateur ne peut ni la fournir ni la remplacer.
      - cle_publique_etat_civil:/publiques/etat-civil:ro
      - cle_publique_nationalite:/publiques/nationalite:ro
      - cle_publique_casier:/publiques/casier:ro
    depends_on:
      keycloak: {condition: service_healthy}
      registre-etat-civil: {condition: service_started}
      registre-nationalite: {condition: service_started}
      registre-casier: {condition: service_started}
    networks: [interne]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/sante')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # USSD simulé *226# (usager.griot.test) : l'usager voit avant, vérifie après.
  # Il parle au médiateur par l'API usager, authentifiée par le secret du canal.
  ussd_sim:
    build: ./espace-usager/ussd
    image: griot-ussd:local
    restart: unless-stopped
    secrets: [canal_usager]
    volumes:
      # Annuaire USSD (numéro -> identifiant, PIN), séparé des registres : le jour J, ABONNES_USSD=./donnees_jury/abonnes.yaml
      - ${ABONNES_USSD:-./espace-usager/ussd/abonnes.yaml}:/app/abonnes.yaml:ro
      - ./traduction-moore/phrases-ussd.csv:/app/phrases-ussd.csv:ro
    networks: [interne]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/sante')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Portail web usager (usager.griot.test/portail) : les 3 écrans de l'USSD dans un navigateur.
  # Seulement l'API usager du médiateur, avec SON secret (« canal = web » au journal).
  # Indépendant : « docker compose stop portail » l'arrête sans toucher à l'USSD ni au reste.
  portail:
    build: ./espace-usager/portail
    image: griot-portail:local
    restart: unless-stopped
    secrets: [canal_web]
    volumes:
      # Le même annuaire que l'USSD (numéro -> identifiant, PIN) : mêmes comptes, mêmes règles
      - ${ABONNES_USSD:-./espace-usager/ussd/abonnes.yaml}:/app/abonnes.yaml:ro
      - ./traduction-moore/phrases-portail.csv:/app/phrases-portail.csv:ro
    networks: [interne]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/sante')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Caddy : seul service joignable depuis l'ordinateur, en HTTPS (CA interne)
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./socle/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_donnees:/data              # contient la CA interne : à conserver
    networks: [interne, externe]

# Secrets montés en fichiers dans /run/secrets/, lus depuis le fichier .env
  # Conversion UNE SEULE FOIS d'un PDF scanné en CSV (Tesseract). Jamais lancé avec la pile :
  #   docker compose --profile ocr run --rm ocr /donnees/<fichier>.pdf
  ocr:
    build: ./registres/import/ocr
    image: griot-ocr:local
    profiles: [ocr]
    network_mode: none                 # aucun réseau : les données du jury ne sortent pas
    volumes:
      - ./donnees_jury:/donnees        # le CSV et sa provenance sont écrits à côté du PDF

  # API du jury EN DIRECT (seulement si le jury l'impose ; par défaut on importe un export : exporter_api_jury.py).
  # SEUL conteneur qui touche le réseau extérieur ; ne transmet qu'à API_JURY_URL (.env), en GET, avec délai.
  #   docker compose --profile api-jury up -d --no-deps relais-api-jury
  relais-api-jury:
    build: ./passerelle/sortie
    image: griot-relais-api-jury:local
    profiles: [api-jury]
    restart: unless-stopped
    environment:
      API_JURY_URL: ${API_JURY_URL:-http://api-jury-non-configuree.invalid}
      DELAI_API_JURY: "2"                # secondes : sous les 3 s du médiateur
    secrets: [api_jury]                  # jeton de l'API : connu du relais seul, jamais des registres
    networks: [relais-jury, sortie-jury]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/__sante')"]
      interval: 10s
      timeout: 5s
      retries: 10

secrets:
  api_jury:
    environment: API_JURY_SECRET       # vide tant que le jury ne fournit pas d'API
  guichet_oidc:
    environment: GUICHET_OIDC_SECRET
  sujet_hmac:
    environment: MEDIATEUR_HMAC_SECRET
  canal_usager:
    environment: CANAL_USAGER_SECRET
  canal_web:
    environment: CANAL_WEB_SECRET

volumes:
  postgres_donnees:
  caddy_donnees:
  mediateur_donnees:
  cle_privee_etat_civil:
  cle_publique_etat_civil:
  cle_privee_nationalite:
  cle_publique_nationalite:
  cle_privee_casier:
  cle_publique_casier:
  trace_etat_civil:
  trace_nationalite:
  trace_casier:

networks:
  # Réseau sans aucune sortie vers Internet : Keycloak, PostgreSQL, le guichet et le médiateur
  # ne peuvent physiquement contacter aucun service extérieur.
  interne:
    internal: true
  # Réseau des registres, lui aussi sans Internet : seul le médiateur y est relié.
  registres:
    internal: true
  # Réseau Keycloak <-> registres, sans Internet : chaque registre y lit les clés publiques de Keycloak
  # pour vérifier LUI-MÊME le jeton de l'agent (le service demandeur n'est plus une déclaration du médiateur).
  cles-agents:
    internal: true
  # Réseau ordinaire, utilisé uniquement par Caddy pour publier les ports 80 et 443
  externe: {}
  # Registres <-> relais de l'API du jury, SANS sortie : un registre ne peut joindre que le relais
  relais-jury:
    internal: true
  # Sortie du relais vers l'API du jury (profil api-jury seulement) : aucun autre conteneur n'y est relié
  sortie-jury: {}
