    Body_raccrocher_raccrocher_post:
      properties:
        csrf:
          type: string
          title: Csrf
      type: object
      required:
      - csrf
      title: Body_raccrocher_raccrocher_post
    Body_repondre_portail_attente__id_demande___action__post:
      properties:
        csrf:
          type: string
          title: Csrf
      type: object
      required:
      - csrf
      title: Body_repondre_portail_attente__id_demande___action__post
    Body_retirer_portail_accords__id_demande__retirer_post:
      properties:
        csrf:
          type: string
          title: Csrf
        confirme:
          type: string
