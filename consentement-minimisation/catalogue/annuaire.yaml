# Annuaire : les services demandeurs et les registres joignables.
# Lu par le médiateur et, en lecture seule, par le guichet. Les démarches sont dans demarches.yaml ;
# les attributs sont déclarés par chaque registre dans registres/adaptateurs/<registre>.yaml.

# Format de l'identifiant de l'usager (tapé au guichet, lié à un numéro dans l'annuaire USSD), RÉGLABLE pour
# les données du jury. Expression régulière vérifiée par le médiateur et le guichet. Pas de « / » (il passe
# dans les adresses de l'API). Clé composée (registres sans identifiant commun), par exemple :
#   format: '^[^|/]{1,60}\|[^|/]{1,80}\|\d{4}-\d{2}-\d{2}$'   exemple: KABORE|Aminata|2001-03-14
identifiant_usager:
  format: '^[A-Za-z0-9-]{1,64}$'
  exemple: BF-0001

# Services demandeurs. « groupe » = nom du groupe Keycloak de l'agent (le service vient du jeton,
# jamais d'un formulaire). « nom » = texte montré à l'usager.
# « cle_api_sha256 » = empreinte de la clé API de l'administration (en-tête X-Cle-Api) : on ne garde jamais la clé.
services:
  direction-concours:                # nouveau nom depuis le remaniement de janvier 2026 ; code inchangé
    groupe: Direction des concours – ministère des Serviteurs du peuple
    nom: La Direction des concours – ministère des Serviteurs du peuple
    nom_court: La direction des concours   # dans l'aperçu « … recevra : … » (écran USSD de 160 caractères)
    cle_api_sha256: dc1720cf6ccf4d3177bc8dfb85849c19a9d99afeea21674cf6489419ab89516a   # clé de DÉMO « cle-demo-concours » ; en production : une clé tirée au hasard
  cefore:
    groupe: CEFORE – guichet des entreprises
    nom: Le CEFORE
    cle_api_sha256: 4d4a6469316462e44b92897c594fca3266386e7c388a54bcc263494d8f565d75   # clé de DÉMO « cle-demo-cefore »
  tribunal:
    groupe: Tribunal – certificats de nationalité
    nom: Le tribunal
    cle_api_sha256: 85d7bd4a4aff42e8915aebe0da175fdd4e277c776b5dc47ca926b566fe203309   # clé de DÉMO « cle-demo-tribunal »
  # Services retirés du catalogue actif le 17/11 (bourses, mairie, passeport) : voir LIMITES.md et
  # consentement-minimisation/catalogue/demarches-inactives.yaml (conservés, non chargés).

# Registres joignables par la passerelle (réseau Docker « registres » uniquement) : brancher un registre = ajouter
# un bloc ici. « url » : son adresse ; « chemin » : sa route DANS LE CONTRAT (GRIOT_CONTRAT), avec {id} pour
# l'identifiant du citoyen. Facultatif : « en_tete_cle » + « cle_secret » (nom de l'en-tête de la clé API de ce registre
# et fichier de /run/secrets qui la contient). Les noms de champs sont dans correspondance.yaml.
registres:
  etat-civil:
    url: http://registre-etat-civil:8000
    chemin: /etat-civil/{id}
    nom: registre d'état civil
  nationalite:
    url: http://registre-nationalite:8000
    chemin: /nationalite/{id}
    nom: registre de la nationalité
  casier:
    url: http://registre-casier:8000
    chemin: /casier/{id}
    nom: casier judiciaire
