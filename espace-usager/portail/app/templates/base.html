<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titre %}{{ t.titre_site }}{% endblock %}</title>
<link rel="stylesheet" href="{{ racine }}/static/portail.css">
</head>
<body>
<p class="bandeau" role="note">{{ t.bandeau }}</p>
<header>
  <a href="{{ racine }}" class="marque">{{ t.titre_site }}</a>
  {% if connecte %}
  <form method="post" action="{{ racine }}/deconnexion">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="lien">{{ t.deconnexion }}</button>
  </form>
  {% endif %}
</header>
<main>
{% block contenu %}{% endblock %}
{% if connecte %}<p class="pied"><a href="{{ racine }}">{{ t.retour_menu }}</a></p>{% endif %}
</main>
</body>
</html>
