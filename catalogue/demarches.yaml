# Catalogue des démarches : AUCUNE démarche n'est écrite dans le code.
# Ajouter une démarche = ajouter un bloc ici, puis `docker compose restart mediateur guichet`
# (voir docs/AJOUTER_UNE_DEMARCHE.md). Le médiateur VALIDE ce fichier au démarrage et refuse de démarrer
# s'il manque une finalité, une base, un texte (base légale) ou si un attribut est inconnu.
# Son empreinte SHA-256 est écrite dans le journal chaîné à chaque chargement.
#
# Pour chaque démarche :
#   libelle   : nom montré à l'agent et à l'usager
#   services  : services autorisés (codes de annuaire.yaml)
#   finalite  : POURQUOI on consulte (montrée à l'usager, écrite au journal)
#   base      : consentement (l'usager voit l'aperçu et confirme) | base_legale (pas de confirmation,
#               mais la consultation apparaît dans son historique avec le texte cité)
#   texte     : texte qui autorise la consultation (obligatoire en base légale)
#   attributs : ce qui est demandé, et RIEN d'autre. Chaque attribut est déclaré par un registre
#               (adaptateurs/<registre>.yaml), qui vérifie de son côté que le service y a droit.
#
# Attributs disponibles :
#   age_entre                 parametres : min, max (facultatif), date_reference (date ou aujourd'hui)
#   nationalite_burkinabe     sans paramètre
#   casier_judiciaire_vierge  sans paramètre
demarches:

  concours-adjoints:
    libelle: Concours direct adjoints administratifs
    services: [direction-concours]
    finalite: vérification des conditions d'inscription au concours direct des adjoints administratifs
    base: base_legale
    # Référence à valider par l'équipe (numéro d'article, communiqué d'ouverture du concours)
    texte: Loi n°081-2015/CNT portant statut général de la fonction publique d'État, conditions d'accès aux emplois (nationalité, âge, moralité)
    attributs:
      - attribut: age_entre
        parametres: {min: 18, max: 37, date_reference: "2026-12-31"}
        libelle: âge de 18 à 37 ans au 31/12/2026
      - attribut: nationalite_burkinabe
        libelle: nationalité burkinabè
      - attribut: casier_judiciaire_vierge
        libelle: casier judiciaire vierge

  bourse-nationale:
    libelle: Bourse nationale
    services: [service-bourses]
    finalite: attribution de la bourse nationale
    base: consentement
    attributs:
      - attribut: nationalite_burkinabe
        libelle: nationalité burkinabè

  verifier-majorite:
    libelle: Vérifier la majorité
    services: [direction-concours, service-bourses, mairie]
    finalite: vérification de la majorité civile
    base: base_legale
    # Majorité civile abaissée de 20 à 18 ans. Le seuil reste un paramètre : changer « min » suffit.
    texte: Code des personnes et de la famille, loi n°012-2025/ALT (majorité civile à 18 ans accomplis)
    attributs:
      - attribut: age_entre
        parametres: {min: 18, date_reference: aujourd'hui}
        libelle: majeur (18 ans accomplis)
