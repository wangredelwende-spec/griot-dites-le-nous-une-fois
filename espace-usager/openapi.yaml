# Contrat d'API de la couche « Espace usager (USSD simulé et portail web) ». GÉNÉRÉ par scripts/generer_openapi.py : ne pas modifier
# à la main (tests/test_openapi.py vérifie qu'il correspond au code).
openapi: 3.1.0
info:
  title: 'Griot : Espace usager (USSD simulé et portail web)'
  description: 'Écrans du citoyen, rendus côté serveur, sans JavaScript : USSD *226# à la racine, portail web sous /portail.
    Formulaires HTML ; ils n''utilisent que l''API de la couche consentement et minimisation et l''historique du journal.'
  version: '1.0'
paths:
  /:
    get:
      summary: Telephone
      operationId: telephone__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    post:
      summary: Saisir
      operationId: saisir__post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_saisir__post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /allumer:
    post:
      summary: Allumer
      operationId: allumer_allumer_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_allumer_allumer_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /raccrocher:
    post:
      summary: Raccrocher
      operationId: raccrocher_raccrocher_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_raccrocher_raccrocher_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /portail:
    get:
      summary: Accueil
      operationId: accueil_portail_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /portail/connexion:
    post:
      summary: Connexion
      description: 'Mêmes règles que l''USSD : 3 PIN faux -> numéro bloqué 5 minutes. Numéro inconnu et PIN faux donnent

        le même message (on ne révèle pas qui est inscrit).'
      operationId: connexion_portail_connexion_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_connexion_portail_connexion_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /portail/deconnexion:
    post:
      summary: Deconnexion
      operationId: deconnexion_portail_deconnexion_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_deconnexion_portail_deconnexion_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /portail/attente:
    get:
      summary: Attente
      operationId: attente_portail_attente_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /portail/attente/{id_demande}/{action}:
    post:
      summary: Repondre
      operationId: repondre_portail_attente__id_demande___action__post
      parameters:
      - name: id_demande
        in: path
        required: true
        schema:
          type: string
          title: Id Demande
      - name: action
        in: path
        required: true
        schema:
          type: string
          title: Action
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_repondre_portail_attente__id_demande___action__post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /portail/historique:
    get:
      summary: Historique
      operationId: historique_portail_historique_get
      parameters:
      - name: page_n
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Page N
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
