# Catalogue des démarches ACTIVES : AUCUNE démarche n'est écrite dans le code.
# Ajouter une démarche = ajouter un bloc ici et enregistrer : la passerelle relit le fichier toute seule, sans
# redémarrage (voir docs/AJOUTER_UNE_DEMARCHE.md). Elle VALIDE chaque nouvelle version : finalité, base, texte
# (base légale), durée de l'accord (consentement), attributs déclarés par un registre, double clé.
# Version invalide : REFUSÉE, l'ancienne reste en vigueur ; chaque chargement ou refus est écrit au journal chaîné.
# Les démarches retirées (passeport, bourse, majorité, CEFORE) sont dans demarches-inactives.yaml (non chargé).
#
# Pour chaque démarche :
#   libelle   : nom montré à l'agent et à l'usager
#   services  : services autorisés (codes de annuaire.yaml) = le demandeur autorisé
#   finalite  : POURQUOI on consulte (montrée à l'usager, écrite au journal)
#   base      : consentement (l'usager voit l'aperçu et donne son accord) | base_legale (pas d'accord, mais la
#               consultation apparaît dans son historique avec le texte cité)
#   duree_accord_heures : (consentement) combien de temps l'accord reste valable ; tant qu'il est valable, la même
#               démarche pour le même service reçoit une réponse immédiate. L'usager peut le retirer à tout moment.
#   texte     : texte qui autorise la consultation (obligatoire en base légale)
#   attributs : ce qui est permis, et RIEN d'autre. « attendu » / « si_non » : affichage au guichet.
#
# Attributs : majeur, nationalite_bf, casier_vierge (oui/non) ; identite, naissance_filiation (valeurs précises,
# réservées aux démarches qui en ont besoin). Voir registres/adaptateurs/*.yaml.
demarches:

  concours-direct:
    libelle: Concours direct de la fonction publique
    services: [direction-concours]
    finalite: vérification des conditions d'inscription au concours direct de la fonction publique
    finalite_mos: "gulsga noy-makr n na n ke konkuur directa"     # traduction de l'équipe
    base: base_legale
    # Aucun texte de loi n'est cité tant qu'il n'est pas vérifié. Seuil d'âge : « min » ci-dessous (seuil configurable,
    # 18 ans par défaut), à autoriser aussi pour ce service dans attributs.yaml.
    texte: Conditions d'accès au concours direct fixées par l'administration du concours (texte de référence à confirmer par elle)
    attributs:
      - attribut: majeur
        parametres: {min: 18, date_reference: aujourd'hui}
        libelle: majeur (18 ans accomplis)
      - attribut: nationalite_bf
        libelle: nationalité burkinabè
      - attribut: casier_vierge
        libelle: casier judiciaire vierge

  carte-identite-oni:
    libelle: Établissement de la carte nationale d'identité (ONI)
    services: [oni]
    finalite: établissement de la carte nationale d'identité burkinabè
    base: base_legale
    # Ce qui remplace les pièces demandées aujourd'hui : l'acte de naissance (né au Burkina) ou le certificat de
    # nationalité (né à l'étranger). Aucun texte de loi n'est cité tant qu'il n'est pas vérifié.
    texte: "Mission légale de l'Office national d'identification (ONI) : établissement de la carte nationale d'identité (texte de référence à confirmer par l'ONI)"
    attributs:
      - attribut: identite
        libelle: identité (nom et prénoms)
      - attribut: naissance_filiation
        libelle: naissance (date et lieu) et filiation
      - attribut: nationalite_bf
        libelle: nationalité burkinabè

  certificat-nationalite:
    libelle: Certificat de nationalité
    services: [tribunal]
    finalite: délivrance d'un certificat de nationalité
    base: consentement
    duree_accord_heures: 24           # une demande ponctuelle
    attributs:
      - attribut: naissance_filiation
        libelle: naissance et filiation
